services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memorycare
      POSTGRES_USER: memorycare
      POSTGRES_PASSWORD: local_demo_only
    ports:
      - "5432:5432"
    volumes:
      - pg_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorycare -d memorycare"]
      interval: 3s
      timeout: 2s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://memorycare:local_demo_only@db:5432/memorycare
      DEMO_SECRET: change-this-demo-secret-before-sharing
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg_demo_data:

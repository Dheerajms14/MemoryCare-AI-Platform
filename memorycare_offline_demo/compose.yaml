services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memorycare
      POSTGRES_USER: memorycare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random URL-safe POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorycare -d memorycare"]
      interval: 3s
      timeout: 2s
      retries: 20
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://memorycare:${POSTGRES_PASSWORD}@db:5432/memorycare
      MEDIA_DIR: /code/media
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - memorycare_media:/code/media
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg_demo_data:
  memorycare_media:
